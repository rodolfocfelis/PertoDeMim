name: Validate backend and frontend
on:
  pull_request:
  push:
    branches:
      - 'feat/**'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://localhost:5432/search_professionals
      DB_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated test database with ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 64)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD="$DB_PASSWORD"
          docker run --detach --name pertodemim-ci-db \
            -e POSTGRES_DB=search_professionals -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD -p 127.0.0.1:5432:5432 postgres:17
          for attempt in {1..60}; do
            if docker exec pertodemim-ci-db pg_isready -U postgres -d search_professionals; then
              exit 0
            fi
            sleep 1
          done
          docker logs pertodemim-ci-db
          exit 1
      - run: bash ./mvnw -B verify
      - name: Stop test database
        if: always()
        run: docker rm --force pertodemim-ci-db || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React if present
        shell: bash
        run: |
          if [ -f frontend-react/package.json ]; then
            cd frontend-react
            npm install --no-audit --no-fund
            npm run build
          else
            echo "React frontend not yet present on this branch"
          fi
