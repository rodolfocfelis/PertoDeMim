# PostgreSQL: configure DB_URL, DB_USER e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/search_professionals}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway: bases legadas com esquema existente recebem baseline na versão 1.
# Revise o esquema legado antes de habilitar migrations em produção.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Forneça um segredo forte por variável de ambiente; sem fallback inseguro.
api.security.token.secret=${JWT_SECRET}

# Conta administrativa opcional: informe ambos os valores apenas no bootstrap controlado.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
