# PostgreSQL: configure DB_URL, DB_USER e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/search_professionals}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Forneça um segredo forte por variável de ambiente; sem fallback inseguro.
api.security.token.secret=${JWT_SECRET}
